<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Screening Panel Selector</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --primary-blue: #2563eb; /* Blue-700 */
            --light-gray: #f9fafb;
            --border-color: #e5e7eb;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 1rem;
            padding-bottom: 2rem;
        }
        .panel-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
        }
        #detailPanel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 50;
            overflow-y: auto;
        }
        #detailPanel.open {
            transform: translateX(0);
        }
        .drug-item {
            cursor: pointer;
            transition: background-color 0.15s, transform 0.15s, box-shadow 0.15s; 
        }
        .drug-item:hover {
            background-color: #f0f4f8;
            transform: scale(1.002);
        }
        #headerCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            z-index: -1;
        }
        .arrow-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .tooltip {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            position: absolute;
            right: 100%;
            top: 50%;
            transform: translateY(-50%) translateX(-10px);
            white-space: nowrap;
            padding: 4px 8px;
            background-color: #1f2937;
            color: white;
            font-size: 11px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 30;
        }
        .tooltip::after {
            content: '';
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent transparent #1f2937;
        }
        .arrow-container:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }
        /* Toggle Switch Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #2563eb;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #2563eb;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#2563eb',
                        'light-gray': '#f9fafb',
                    }
                }
            }
        }

        const DRUG_PANELS_DATA = {
            "5 Panel Drug": {
                price: "$4.2",
                items: ["Amphetamines (AMP)", "Cocaine (COC)", "Marijuana (THC)", "Opiates (OPI)", "Phencyclidine (PCP)"],
                order: 5 
            },
            "7 Panel Drug": {
                price: "$4.2",
                items: ["Amphetamines", "Barbiturates", "Benzodiazepines", "Cocaine", "Opiates", "Phencyclidine (PCP)", "Marijuana"],
                order: 7 
            },
            "9 Panel Drug": { 
                price: "$4.2",
                items: ["Amphetamines", "Barbiturates", "Benzodiazepines", "Cocaine", "Methadone", "Methaqualone", "Opiates", "Phencyclidine (PCP)", "Propoxyphene"],
                order: 9 
            },
            "10 Panel Drug": {
                price: "$4.2",
                items: ["Amphetamines", "Barbiturates", "Benzodiazepines", "Cocaine", "Marijuana", "Methadone", "Methaqualone", "Opiates", "Phencyclidine (PCP)", "Propoxyphene"],
                order: 10 
            },
            "10 Panel Drug + Alcohol": { 
                price: "$4.2",
                items: ["Amphetamines", "Barbiturates", "Benzodiazepines", "Cocaine", "Marijuana", "Methadone", "Methaqualone", "Opiates", "Phencyclidine (PCP)", "Propoxyphene", "Ethanol"],
                order: 11 
            }
        };

        const INSTANT_DRUGS_DATA = {
            "5 Panel Instant Drug": {
                price: "$ 6.82",
                items: ["Amphetamines", "Cocaine", "Marijuana", "Opiates", "Phencyclidine"],
                order: 50
            },
            "10 Panel Instant Drug": {
                price: "$ 6.82",
                items: ["Amphetamines", "Barbiturates", "Benzodiazepines", "Cocaine", "Marijuana", "Methadone", "Methaqualone", "Opiates", "Phencyclidine", "Propoxyphene"],
                order: 100
            }
        };

        function normalizeString(str) {
            return str.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
        }

        let detailPanel, detailTitle, detailList, searchInput, thcToggle;
        let selectedPanelName = null;
        let currentPanelName = null;
        let isNoTHC = false;

        document.addEventListener('DOMContentLoaded', () => {
            detailPanel = document.getElementById('detailPanel');
            detailTitle = document.getElementById('detailTitle');
            detailList = document.getElementById('detailList');
            searchInput = document.getElementById('searchInput');
            thcToggle = document.getElementById('thcToggle');

            searchInput.addEventListener('input', filterDrugList);
            thcToggle.addEventListener('change', (e) => {
                isNoTHC = e.target.checked;
                filterDrugList();
            });

            initializeCanvas();
            filterDrugList();
        });

        function handleDirectSelection(panelName, event) {
            if (event) event.stopPropagation(); 
            if (selectedPanelName === panelName) {
                selectedPanelName = null;
            } else {
                selectedPanelName = panelName;
            }
            filterDrugList();
            if (detailPanel.classList.contains('open') && currentPanelName === panelName) {
                hideDetails();
            }
        }
        
        function selectPanel() {
            if (currentPanelName) {
                handleDirectSelection(currentPanelName);
                hideDetails();
            }
        }

        function filterDrugList() {
            const rawQuery = searchInput.value.trim();
            // Split by comma or space for multiple substance searching
            const queryParts = rawQuery.split(/[,\s]+/).filter(p => p.length > 0).map(p => normalizeString(p));

            const processSection = (data) => {
                const results = [];
                for (const name in data) {
                    const panel = data[name];
                    const normalizedName = normalizeString(name);
                    const normalizedItems = panel.items.map(i => normalizeString(i));

                    // Filter 1: No THC logic
                    if (isNoTHC) {
                        const hasTHC = normalizedItems.some(item => item.includes('marijuana') || item.includes('thc'));
                        if (hasTHC) continue;
                    }

                    // Filter 2: Search logic (AND condition)
                    if (queryParts.length > 0) {
                        // Check if EVERY part of the query is found either in the title or the items
                        const allPartsMatch = queryParts.every(part => {
                            const inName = normalizedName.includes(part);
                            const inItems = normalizedItems.some(item => item.includes(part));
                            return inName || inItems;
                        });
                        
                        if (!allPartsMatch) continue;
                    }

                    results.push(name);
                }
                return results.sort((a, b) => data[a].order - data[b].order);
            };

            const standardResults = processSection(DRUG_PANELS_DATA);
            const instantResults = processSection(INSTANT_DRUGS_DATA);

            renderSections(standardResults, instantResults);
        }

        function renderSections(standardNames, instantNames) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = '';

            // Standard Drugs Section
            const standardHeader = document.createElement('div');
            standardHeader.className = 'p-4 pt-2 bg-white';
            standardHeader.innerHTML = `<h2 class="text-xs font-bold text-gray-900 uppercase tracking-wider">Drug (${standardNames.length})</h2>`;
            container.appendChild(standardHeader);

            const standardList = document.createElement('div');
            standardList.className = 'bg-white divide-y divide-gray-100 mb-4';
            standardNames.forEach(name => standardList.appendChild(createItemNode(name, DRUG_PANELS_DATA[name])));
            container.appendChild(standardList);

            // Instant Drugs Section
            const instantHeader = document.createElement('div');
            instantHeader.className = 'p-4 pt-2 bg-white';
            instantHeader.innerHTML = `<h2 class="text-xs font-bold text-gray-900 uppercase tracking-wider">Instant Drugs (${instantNames.length})</h2>`;
            container.appendChild(instantHeader);

            const instantList = document.createElement('div');
            instantList.className = 'bg-white divide-y divide-gray-100';
            instantNames.forEach(name => instantList.appendChild(createItemNode(name, INSTANT_DRUGS_DATA[name])));
            container.appendChild(instantList);
        }

        function createItemNode(panelName, data) {
            const isSelected = panelName === selectedPanelName;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'drug-item group flex items-center justify-between p-4 border-b border-gray-100 last:border-b-0'; 
            itemDiv.onclick = () => showDetails(panelName, data); 
            
            itemDiv.innerHTML = `
                <div class="flex items-center space-x-3 cursor-pointer" onclick="handleDirectSelection('${panelName}', event)">
                    <div class="w-4 h-4 rounded-full border ${isSelected ? 'border-primary-blue bg-primary-blue flex items-center justify-center' : 'border-gray-300 bg-white'}">
                        ${isSelected ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                    </div>
                    <span class="text-sm font-medium text-gray-800">${panelName}</span>
                </div>
                <div class="arrow-container text-primary-blue font-semibold">
                    <span class="text-xs text-gray-500 mr-2">${data.price}</span>
                    <div class="tooltip">Click to view panel items</div>
                    <svg class="w-4 h-4 transition-transform duration-200 group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            `;
            return itemDiv;
        }
        
        function showDetails(panelName, data) {
            currentPanelName = panelName;
            detailTitle.textContent = panelName;
            detailList.innerHTML = '';
            data.items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'text-gray-700 text-sm py-2 px-6 border-b border-gray-100 last:border-b-0';
                li.textContent = item;
                detailList.appendChild(li);
            });
            detailPanel.classList.add('open');
        }

        function hideDetails() {
            detailPanel.classList.remove('open');
        }

        function initializeCanvas() {
            const canvas = document.getElementById('headerCanvas');
            const ctx = canvas.getContext('2d');
            let dots = [];
            function resizeCanvas() {
                const header = document.querySelector('.header-box');
                canvas.width = header.clientWidth;
                canvas.height = header.clientHeight;
                dots = [];
                for (let i = 0; i < 20; i++) {
                    dots.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 0.8 + 0.2,
                        velocity: { x: (Math.random() - 0.5) * 0.1, y: (Math.random() - 0.5) * 0.1 }
                    });
                }
            }
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(37, 99, 235, 0.4)';
                dots.forEach(dot => {
                    dot.x += dot.velocity.x;
                    dot.y += dot.velocity.y;
                    if (dot.x < 0 || dot.x > canvas.width) dot.velocity.x *= -1;
                    if (dot.y < 0 || dot.y > canvas.height) dot.velocity.y *= -1;
                    ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2); ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            draw();
        }
    </script>
</head>
<body>
    <div class="panel-container">
        <!-- Header -->
        <header class="header-box relative p-4 border-b border-gray-200">
            <canvas id="headerCanvas"></canvas> 
            <div class="relative flex justify-between items-center z-10">
                <h1 class="text-lg font-bold text-gray-900">Request Checks</h1>
                <button class="text-gray-500 hover:text-gray-700 text-sm font-medium">
                    <span class="mr-1">X</span> Close
                </button>
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex border-b border-gray-200 bg-white sticky top-0 z-10">
            <div class="flex-1 p-3 text-center text-xs text-gray-400 font-medium">Background Screening</div>
            <div class="flex-1 p-3 text-center text-primary-blue text-xs font-semibold border-b-2 border-primary-blue transition duration-150">
                Health Screening
            </div>
        </div>

        <!-- Filters Section -->
        <div class="p-4 pb-2 bg-white space-y-3">
            <!-- No THC Toggle -->
            <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-gray-700">No THC</span>
                <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="thcToggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer outline-none transition-all duration-300"/>
                    <label for="thcToggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>

            <!-- Reduced Search Bar -->
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Search drug names..." 
                       class="w-full py-1.5 px-3 text-sm border border-gray-300 rounded-md focus:ring-1 focus:ring-primary-blue focus:border-primary-blue text-gray-700 transition-all">
                <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>

        <!-- Dynamic Content (Drug and Instant Sections) -->
        <div id="mainContentContainer" class="flex-grow overflow-y-auto">
            <!-- Rendered via JS -->
        </div>

        <!-- Detail Panel Slide-out -->
        <div id="detailPanel" class="p-0 flex flex-col">
            <div class="p-4 border-b border-gray-200 flex items-center bg-light-gray sticky top-0 z-10">
                <button onclick="hideDetails()" class="text-gray-700 hover:text-gray-900 mr-4 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="detailTitle" class="text-md font-bold text-gray-900 truncate">Panel Details</h2>
            </div>
            <div class="p-4 bg-white flex-grow">
                <h3 class="text-xs font-semibold text-gray-500 uppercase mb-3">Panel Items:</h3>
                <ul id="detailList" class="divide-y divide-gray-100 border border-gray-100 rounded-lg p-0"></ul>
            </div>
            <div class="p-4 border-t border-gray-200 bg-white">
                <button onclick="selectPanel()" class="w-full py-2.5 bg-primary-blue text-white text-sm font-semibold rounded-lg shadow hover:bg-blue-700 transition-colors">Select Panel</button>
            </div>
        </div>
    </div>
</body>
</html>
